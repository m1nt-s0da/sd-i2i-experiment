[i2i]
prompt = "masterwork, best quality, anime artwork, anime style, key visual, 1boy, solo, handsome school boy, short black hair, messy bangs, brown eyes, smiling, looking at viewer, school uniform, gakuran, upper body, classroom background, soft lighting, depth of field"
negative_prompt = "1girl, female, woman, female breasts, long hair, ponytail, twintails, skirt, sailor suit, worst quality, low quality, normal quality, lowres, bad anatomy, bad hands, missing fingers, extra digits, fewer digits, cropped, monochrome, grayscale, photo, realistic, 3d, rendering, text, watermark, signature"

guidance_scale = 8.0
steps = 30
start_step = 0
seed = 42
latent_pixel_count = 8
output_path = "output/i2i_anime.png"

[i2i.step_map]
probe_steps = 30
refine_steps = 5
threshold = 0.95
heatmap_path = "output/i2i-anime-heatmap.png"

[i2i.input]
# type = "generate"
# prompt = "masterwork, best quality, anime artwork, anime style, key visual, 1girl, solo, cute school girl, long black hair, straight bangs, brown eyes, smiling, looking at viewer, school uniform, sailor suit, upper body, classroom background, soft lighting, depth of field"
# negative_prompt = "worst quality, low quality, normal quality, lowres, bad anatomy, bad hands, missing fingers, extra digits, fewer digits, cropped, monochrome, grayscale, photo, realistic, 3d, rendering, text, watermark, signature"
# guidance_scale = 8.0
# steps = 30
# width = 512
# height = 512
# seed = 42
# save_path = "output/input_anime.png"
type = "image"
path = "output/input_anime.png"

[i2i.pipeline]
architecture = "sd15"
model = "stable-diffusion-v1-5/stable-diffusion-v1-5"
dtype = "float16"
device = "cuda"
sampler = "euler"
enable_attention_slicing = true

[i2i.pipeline.vae]
enable_slicing = true

